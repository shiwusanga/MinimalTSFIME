# 免费云端编译：不需要本地装任何东西
# windows-2022 镜像自带 Visual Studio 2022 (v143) 和 Windows SDK。

name: 编译 TSF 输入法 DLL

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 准备 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 环境自检
        shell: pwsh
        run: |
          $libs = 'C:\Program Files (x86)\Windows Kits\10\Lib'
          $vers = (Get-ChildItem $libs -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', '
          Write-Output "::notice::Windows SDK 版本: $vers"
          $f = Get-ChildItem $libs -Recurse -Filter 'msctf.lib' -ErrorAction SilentlyContinue | Select-Object -First 3 -ExpandProperty FullName
          Write-Output ("::notice::msctf.lib: " + ($(if ($f) { $f -join '; ' } else { '未找到' })))

      - name: 编译 x64 Release
        id: bx64
        shell: pwsh
        run: |
          msbuild MinimalTSFIME.sln /m /nologo /verbosity:minimal /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 2>&1 | Tee-Object -FilePath build-x64.log
          $c = $LASTEXITCODE
          Add-Content build-x64.log "EXITCODE=$c"
          if ($c -ne 0) {
            Write-Output "::error title=x64::msbuild exit code $c"
            Get-Content build-x64.log |
              Where-Object { $_ -match '(?i)error|fatal|MSB|LNK|cannot open|未生成' } |
              Select-Object -First 25 |
              ForEach-Object {
                $s = $_.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                Write-Output ("::error::" + $s)
              }
            exit 1
          }

      - name: 编译 Win32 Release
        id: bx86
        shell: pwsh
        run: |
          msbuild MinimalTSFIME.sln /m /nologo /verbosity:minimal /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 2>&1 | Tee-Object -FilePath build-x86.log
          $c = $LASTEXITCODE
          Add-Content build-x86.log "EXITCODE=$c"
          if ($c -ne 0) {
            Write-Output "::error title=Win32::msbuild exit code $c"
            Get-Content build-x86.log |
              Where-Object { $_ -match '(?i)error|fatal|MSB|LNK|cannot open|未生成' } |
              Select-Object -First 25 |
              ForEach-Object {
                $s = $_.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                Write-Output ("::error::" + $s)
              }
            exit 1
          }

      - name: 上传编译日志（诊断用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
          if-no-files-found: ignore

      - name: 检查产物
        shell: pwsh
        run: |
          if (-not (Test-Path 'x64\Release\MinimalTSFIME.dll'))   { throw 'x64 DLL 未生成' }
          if (-not (Test-Path 'Win32\Release\MinimalTSFIME.dll')) { throw 'Win32 DLL 未生成' }
          Get-Item 'x64\Release\MinimalTSFIME.dll','Win32\Release\MinimalTSFIME.dll' |
            Select-Object FullName, Length

      - name: 打成可直接使用的压缩包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'out\x64\Release','out\Win32\Release' | Out-Null
          Copy-Item 'x64\Release\MinimalTSFIME.dll'        'out\x64\Release\'
          Copy-Item 'Win32\Release\MinimalTSFIME.dll'      'out\Win32\Release\'
          Copy-Item 'install.bat','uninstall.bat','rescue.bat','rescue.ps1','README.md','NO_VS_GUIDE.md' 'out\'
          Compress-Archive -Path 'out\*' -DestinationPath 'MinimalTSFIME-预编译包.zip' -Force

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: MinimalTSFIME-预编译包
          path: MinimalTSFIME-预编译包.zip
          if-no-files-found: error
